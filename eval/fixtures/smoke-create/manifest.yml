id: smoke-create
unit: node
agent: main
intent: "Create a file named greeting.txt whose entire contents are exactly the single word: hello"
expected_owner: [main]
allowed_paths: ["**"]
forbidden_paths: []
required_behavior:
  - "greeting.txt exists and contains 'hello'"
build_cmd: 'python -c "import pathlib; assert pathlib.Path(''greeting.txt'').read_text().strip() == ''hello''"'
timeout: 240
max_cost: null
max_model_calls: null
threshold_override: null
